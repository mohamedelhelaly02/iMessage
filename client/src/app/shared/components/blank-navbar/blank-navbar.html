<header class="blank-navbar" [attr.dir]="isRtl() ? 'rtl' : 'ltr'">
  <div class="blank-navbar__inner">
    <a class="blank-navbar__brand">
      <span class="blank-navbar__logo">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M12 3C6.9 3 2.8 6.4 2.8 10.6c0 2.5 1.4 4.7 3.6 6.1-.1.9-.5 2.2-1.4 3.3-.2.2 0 .5.3.5 1.7-.2 3.2-.9 4.2-1.6.8.2 1.7.3 2.5.3 5.1 0 9.2-3.4 9.2-7.6S17.1 3 12 3z"
            fill="url(#blank-navbar-bubble-gradient)"
          />
          <defs>
            <linearGradient
              id="blank-navbar-bubble-gradient"
              x1="2.8"
              y1="3"
              x2="21.2"
              y2="20.5"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#34c8ff" />
              <stop offset="1" stop-color="#0a84ff" />
            </linearGradient>
          </defs>
        </svg>
      </span>
      <span class="blank-navbar__name">{{ 'NAVBAR.BRAND' | translate }}</span>
    </a>

    <div class="blank-navbar__actions">
      <app-language-switcher></app-language-switcher>

      <button
        (click)="logout()"
        class="blank-navbar__logout"
        type="button"
        [attr.aria-label]="'NAVBAR.LOGOUT' | translate"
        [attr.title]="'NAVBAR.LOGOUT' | translate"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path
            d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M16 17l5-5-5-5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M21 12H9" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="blank-navbar__logout-label">{{ 'NAVBAR.LOGOUT' | translate }}</span>
      </button>
    </div>
  </div>
</header>
