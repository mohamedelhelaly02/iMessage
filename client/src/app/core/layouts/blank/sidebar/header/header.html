<div class="imessage-sidebar-header">
  <div class="imessage-sidebar-title-row">
    <h2>{{ 'CHAT.SIDEBAR_HEADER.TITLE' | translate }}</h2>
    <app-new-conversation></app-new-conversation>
  </div>

  <div class="imessage-search-container">
    <svg class="imessage-search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
      />
    </svg>
    <input
      type="text"
      [placeholder]="'COMMON.SEARCH.PLACEHOLDER' | translate"
      [attr.aria-label]="'COMMON.SEARCH.PLACEHOLDER' | translate"
      [value]="searchQuery()"
      (input)="onSearchInput($event)"
      class="imessage-search-input"
    />
  </div>
</div>
