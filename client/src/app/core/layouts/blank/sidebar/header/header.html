<div class="imessage-sidebar-header">
  <div class="imessage-sidebar-title-row">
    <h2>{{ 'CHAT.SIDEBAR_HEADER.TITLE' | translate }}</h2>
    <button
      class="imessage-new-chat-btn"
      [attr.aria-label]="'CHAT.SIDEBAR_HEADER.NEW_CHAT' | translate"
      [attr.title]="'CHAT.SIDEBAR_HEADER.NEW_CHAT' | translate"
    >
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
        />
      </svg>
    </button>
  </div>

  <div class="imessage-search-container">
    <svg class="imessage-search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
      />
    </svg>
    <input
      type="text"
      [placeholder]="'COMMON.SEARCH.PLACEHOLDER' | translate"
      [attr.aria-label]="'COMMON.SEARCH.PLACEHOLDER' | translate"
      [value]="searchQuery()"
      (input)="onSearchInput($event)"
      class="imessage-search-input"
    />
  </div>
</div>
